---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lldap-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: default
  labels:
    app: lldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lldap
  template:
    metadata:
      labels:
        app: lldap
    spec:
      enableServiceLinks: false # Stoppe l'injection des variables LLDAP_SVC_*
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
        - name: lldap
          image: lldap/lldap:latest
          command: ["/app/lldap"]
          args: ["run"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3890
              name: ldap
            - containerPort: 17170
              name: http
          env:
            - name: LLDAP_DATABASE_URL
              value: "sqlite:///data/users.db" # 3 slashes pour un chemin absolu
            - name: LLDAP_KEY_FILE
              value: "/data/server_key" # Redirige l'écriture vers le stockage Longhorn
            - name: LLDAP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lldap-secrets
                  key: LLDAP_JWT_SECRET
            - name: LLDAP_LDAP_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: lldap-secrets
                  key: LLDAP_LDAP_USER_PASS
            - name: LLDAP_LDAP_BASE_DN
              value: "dc=home,dc=arpa"
            - name: LLDAP_HTTP_URL
              value: "http://lldap.home.arpa"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 250Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lldap-data-pvc
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lldap-svc
  namespace: default
spec:
  selector:
    app: lldap
  ports:
    - name: http
      port: 17170
      targetPort: 17170
    - name: ldap
      port: 3890
      targetPort: 3890
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lldap-ingress
  namespace: default
spec:
  rules:
  - host: lldap.home.arpa
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lldap-svc
            port:
              number: 17170
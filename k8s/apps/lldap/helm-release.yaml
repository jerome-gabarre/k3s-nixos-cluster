apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
  namespace: default
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: app-template
      version: "3.7.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  values:
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      lldap:
        strategy: Recreate
        containers:
          app:
            image:
              repository: lldap/lldap
              tag: v0.6.1-alpine
            command: ["/app/lldap"]
            args: ["run"]
            env:
              LLDAP_DATABASE_URL: "sqlite:///data/users.db"
              LLDAP_KEY_FILE: "/data/server_key"
              LLDAP_LDAP_BASE_DN: "dc=home,dc=arpa"
              LLDAP_HTTP_URL: "http://lldap.home.arpa"
              LLDAP_JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: lldap-secrets
                    key: LLDAP_JWT_SECRET
              LLDAP_LDAP_USER_PASS:
                valueFrom:
                  secretKeyRef:
                    name: lldap-secrets
                    key: LLDAP_LDAP_USER_PASS
            probes:
              startup:
                enabled: true
                spec:
                  tcpSocket:
                    port: 17170
                  failureThreshold: 30
                  periodSeconds: 2
              liveness:
                enabled: true
                spec:
                  tcpSocket:
                    port: 17170
                  periodSeconds: 10
              readiness:
                enabled: true
                spec:
                  tcpSocket:
                    port: 3890
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 300m
                memory: 192Mi
    service:
      svc:
        controller: lldap
        ports:
          http:
            port: 17170
          ldap:
            port: 3890
    ingress:
      main:
        enabled: true
        className: traefik
        hosts:
          - host: lldap.home.arpa
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: svc
                  port: http
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
      tmp:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        globalMounts:
          - path: /tmp
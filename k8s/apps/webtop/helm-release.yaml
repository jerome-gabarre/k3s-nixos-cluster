apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: webtop
  namespace: default
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: app-template
      version: "5.3.x"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      webtop:
        strategy: Recreate
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/webtop
              tag: alpine-icewm-version-728f016d
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "Europe/Paris"
            probes:
              startup:
                enabled: true
                spec:
                  tcpSocket:
                    port: 3000
                  failureThreshold: 30
                  periodSeconds: 2
              liveness:
                enabled: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 10
              readiness:
                enabled: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
    service:
      svc:
        controller: webtop
        ports:
          http:
            port: 3000
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        hosts:
          - host: webtop.home.arpa
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: svc
                  port: http
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /config
      dshm:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
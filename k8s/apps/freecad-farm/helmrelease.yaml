apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freecad-cam-farm
  namespace: cfao-system
spec:
  interval: 5m
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
  chart:
    spec:
      chart: app-template
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      cam-worker:
        type: deployment
        replicas: 4
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: registry.kube-system.svc.cluster.local:5000/freecad-turbo-worker
              tag: latest
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/freecad-turbo-worker", "--ready"]
                  periodSeconds: 2
                  failureThreshold: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/freecad-turbo-worker", "--healthcheck"]
                  periodSeconds: 10
                  failureThreshold: 2
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/freecad-turbo-worker", "--ready"]
                  periodSeconds: 5
                  failureThreshold: 2
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                memory: 1800Mi

    defaultPodOptions:
      # Isolation stricte du control-plane et support multi-architecture (x86_64 + ARM64)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64", "arm64"]

    persistence:
      ram-spool:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm/freecad-global-spool
      cam-projects:
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteMany
        size: 20Gi
        globalMounts:
          - path: /var/lib/freecad-projects
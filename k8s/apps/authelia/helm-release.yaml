apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: authelia
      version: "0.11.x"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    pod:
      selectors:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                  - amd64
    
    # 1. Nouvelle gestion des secrets (montage fichier natif)
    secret:
      existingSecret: authelia-secrets
    
    # 2. Nouvelle racine de persistance
    persistence:
      enabled: true
      storageClass: longhorn
      accessModes:
        - ReadWriteOnce
      size: 1Gi
    
    # 3. Nouvelle structure Ingress
    ingress:
      enabled: true
      className: traefik
      rulesOverride:
        - host: auth.home.arpa
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: authelia
                    port:
                      number: 80 # Le port service par défaut du chart
                      
    # 4. Refonte du ConfigMap
    configMap:
      theme: dark
      server:
        port: 9091
      totp:
        issuer: authelia.home.arpa
      identity_validation:
        reset_password:
          secret:
            path: /secrets/JWT_SECRET
      authentication_backend:
        ldap:
          implementation: custom
          address: ldap://lldap-svc.default.svc.cluster.local:3890
          timeout: 5s
          start_tls: false
          base_dn: dc=home,dc=arpa
          additional_users_dn: ou=people
          users_filter: (&({username_attribute}={input})(objectClass=person))
          additional_groups_dn: ou=groups
          groups_filter: (member={dn})
          user: uid=admin,ou=people,dc=home,dc=arpa
          password:
            path: /secrets/LLDAP_PASSWORD
      session:
        name: authelia_session
        expiration: 3600
        inactivity: 300
        encryption_key:
          path: /secrets/SESSION_SECRET
        cookies:
          - domain: home.arpa
            subdomain: auth
            default_redirection_url: https://auth.home.arpa
      storage:
        encryption_key:
          path: /secrets/STORAGE_ENCRYPTION_KEY
        local:
          enabled: true
          path: /data/authelia.sqlite3
      notifier:
        disable_startup_check: true
        filesystem:
          enabled: true
          filename: /data/notification.txt
      access_control:
        default_policy: bypass
        rules:
          - domain: "*.home.arpa"
            policy: bypass
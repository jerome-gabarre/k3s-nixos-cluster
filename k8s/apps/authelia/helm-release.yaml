apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: authelia
      version: "0.11.x"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    pod:
      kind: Deployment
      replicas: 1
      selectors:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                  - amd64
    
    # Nouvelle racine de persistance
    persistence:
      enabled: true
      storageClass: longhorn
      accessModes:
        - ReadWriteOnce
      size: 1Gi
    
    # Ingress avec classe Traefik (nécessaire pour la prise en charge)
    ingress:
      enabled: true
      className: traefik

    secret:
      existingSecret: authelia-secrets
      additionalSecrets:
        authelia-secrets: {} # Laisse le chart créer le dossier /secrets/authelia-secrets/
                           
    # Refonte du ConfigMap avec montage dynamique des secrets par clé
    configMap:
      theme: dark
      server:
        port: 9091
      totp:
        issuer: authelia.home.arpa
      identity_validation:
        reset_password:
          secret:
            secret_name: authelia-secrets
            path: JWT_SECRET
      authentication_backend:
        ldap:
          enabled: true # <-- Activation explicite requise
          implementation: custom
          address: ldap://lldap-svc.default.svc.cluster.local:3890
          timeout: 5s
          start_tls: false
          base_dn: dc=home,dc=arpa
          additional_users_dn: ou=people
          users_filter: (&({username_attribute}={input})(objectClass=person))
          additional_groups_dn: ou=groups
          groups_filter: (member={dn})
          user: uid=admin,ou=people,dc=home,dc=arpa
          password:
            secret_name: authelia-secrets
            path: LLDAP_PASSWORD
      session:
        name: authelia_session
        expiration: 3600
        inactivity: 300
        encryption_key:
          secret_name: authelia-secrets
          path: SESSION_SECRET
        cookies:
          - domain: auth.home.arpa # <-- Correction du domaine cookie
            # default_redirection_url supprimé pour éviter la boucle
      storage:
        encryption_key:
          secret_name: authelia-secrets
          path: STORAGE_ENCRYPTION_KEY
        local:
          enabled: true
          path: /config/authelia.sqlite3
      notifier:
        disable_startup_check: true
        filesystem:
          enabled: true
          filename: /config/notification.txt
      access_control:
        default_policy: bypass
        rules:
          - domain: "*.home.arpa"
            policy: bypass
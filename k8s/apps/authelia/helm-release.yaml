apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: default
spec:
  interval: 10m
  chart:
    spec:
      chart: authelia
      version: "0.9.x" # Laisse Renovate ajuster la version exacte ultérieurement
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
      extraEnvFrom:
        - secretRef:
            name: authelia-secrets
    configMap:
      theme: dark
      jwt_secret: '{{ env "JWT_SECRET" }}'
      default_redirection_url: https://auth.home.arpa
      server:
        host: 0.0.0.0
        port: 9091
      totp:
        issuer: authelia.home.arpa
      authentication_backend:
        ldap:
          implementation: custom
          url: ldap://lldap-svc.default.svc.cluster.local:3890
          timeout: 5s
          start_tls: false
          base_dn: dc=home,dc=arpa
          additional_users_dn: ou=people
          users_filter: (&({username_attribute}={input})(objectClass=person))
          additional_groups_dn: ou=groups
          groups_filter: (member={dn})
          user: uid=admin,ou=people,dc=home,dc=arpa
          password: '{{ env "LLDAP_PASSWORD" }}'
      session:
        name: authelia_session
        secret: '{{ env "SESSION_SECRET" }}'
        expiration: 3600
        inactivity: 300
        domain: home.arpa
      storage:
        encryption_key: '{{ env "STORAGE_ENCRYPTION_KEY" }}'
        local:
          path: /data/authelia.sqlite3
      notifier:
        disable_startup_check: true
        filesystem:
          filename: /data/notification.txt
      access_control:
        default_policy: bypass # Stratégie permissive pour valider le premier lancement
        rules:
          - domain: "*.home.arpa"
            policy: bypass
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: auth.home.arpa
          paths:
            - path: /
              pathType: Prefix
    persistence:
      data:
        enabled: true
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        mountPath: /data
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: default
spec:
  interval: 10m
  timeout: 5m
  dependsOn:
    - name: lldap
      namespace: default
  chart:
    spec:
      chart: authelia
      version: "0.11.x"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  values:
    pod:
      kind: Deployment
      replicas: 1
      env:
        - name: GOMEMLIMIT
          value: "180MiB"
        - name: GOGC
          value: "80"
      securityContext:
        pod:
          fsGroup: 1000
        container:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - ALL
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 200Mi
    persistence:
      enabled: true
      storageClass: longhorn
      accessModes:
        - ReadWriteOnce
      size: 1Gi
    ingress:
      enabled: true
      className: traefik
    secret:
      existingSecret: authelia-secrets
      additionalSecrets:
        authelia-secrets: {}
    configMap:
      theme: dark
      log:
        level: info
        format: json
      server:
        port: 9091
      totp:
        issuer: authelia.home.arpa
      identity_validation:
        reset_password:
          secret:
            secret_name: authelia-secrets
            path: JWT_SECRET
      authentication_backend:
        ldap:
          enabled: true
          implementation: custom
          address: ldap://lldap-svc.default.svc.cluster.local:3890
          timeout: 5s
          start_tls: false
          base_dn: dc=home,dc=arpa
          additional_users_dn: ou=people
          users_filter: (&({username_attribute}={input})(objectClass=person))
          additional_groups_dn: ou=groups
          groups_filter: (member={dn})
          user: uid=admin,ou=people,dc=home,dc=arpa
          password:
            secret_name: authelia-secrets
            path: LLDAP_PASSWORD
      session:
        name: authelia_session
        expiration: 3600
        inactivity: 300
        encryption_key:
          secret_name: authelia-secrets
          path: SESSION_SECRET
        cookies:
          - domain: auth.home.arpa
      storage:
        encryption_key:
          secret_name: authelia-secrets
          path: STORAGE_ENCRYPTION_KEY
        local:
          enabled: true
          path: /config/authelia.sqlite3
      notifier:
        disable_startup_check: true
        filesystem:
          enabled: true
          filename: /config/notification.txt
      access_control:
        default_policy: bypass
        rules:
          - domain: "*.home.arpa"
            policy: bypass
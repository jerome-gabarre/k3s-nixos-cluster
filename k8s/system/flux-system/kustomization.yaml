apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - apps-sync.yaml
patches:
  - target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=flux"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
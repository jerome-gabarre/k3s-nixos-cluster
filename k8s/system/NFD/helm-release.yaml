apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: flux-system
spec:
  interval: 15m
  timeout: 5m
  targetNamespace: kube-system
  chart:
    spec:
      chart: node-feature-discovery
      version: "0.20.x"
      sourceRef:
        kind: HelmRepository
        name: nfd
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  values:
    master:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
    worker:
      config:
        core:
          sleepInterval: 60s
          sources:
            - cpu
            - pci
            - usb
            - storage
            - network
            - kernel
            - memory
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi

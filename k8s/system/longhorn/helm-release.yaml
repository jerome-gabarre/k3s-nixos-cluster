apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: longhorn-system
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    csi:
      kubeletRootDir: /var/lib/rancher/k3s/agent/kubelet
    defaultSettings:
      defaultReplicaCount: 1
      priorityClass: "longhorn-critical"
    persistence:
      defaultClassReplicaCount: 1
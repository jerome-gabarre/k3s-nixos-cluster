apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  targetNamespace: longhorn-system
  chart:
    spec:
      chart: longhorn
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  values:
    csi:
      kubeletRootDir: /var/lib/kubelet
    longhornManager:
      env:
        - name: KUBELET_ROOT_DIR
          value: /var/lib/kubelet
    defaultSettings:
      defaultReplicaCount: 1
      priorityClass: "longhorn-critical"
      createDefaultDiskLabeledNodes: false
      defaultDataPath: /var/lib/longhorn
      concurrentReplicaRebuildPerNodeLimit: 5
      backupCompressionMethod: lz4
      fastReplicaRebuildEnabled: true
      autoSalvage: true
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1
      defaultDataLocality: best-effort
      reclaimPolicy: Retain
    ingress:
      enabled: true
      ingressClassName: traefik
      host: longhorn.home.arpa
      path: /
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-driver-deployer
                namespace: longhorn-system
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-longhorn-manager
                        command: ["sh", "-c", "curl -f -m 1 -s -o /dev/null http://longhorn-backend:9500/v1"]

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: longhorn-system
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    csi:
      kubeletRootDir: /var/lib/kubelet
    longhornManager:
      env:
        - name: KUBELET_ROOT_DIR
          value: /var/lib/kubelet
    defaultSettings:
      defaultReplicaCount: 1
      priorityClass: "longhorn-critical"
    persistence:
      defaultClassReplicaCount: 1
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-driver-deployer
                namespace: longhorn-system
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-longhorn-manager
                        # Échec immédiat, le Kubelet gère la boucle d'attente dynamique
                        command: ["sh", "-c", "curl -f -m 1 -s -o /dev/null http://longhorn-backend:9500/v1"]
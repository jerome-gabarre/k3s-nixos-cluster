apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 15m
  timeout: 5m
  targetNamespace: metallb-system
  chart:
    spec:
      chart: metallb
      version: "0.16.x"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  values:
    controller:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
    speaker:
      tolerateMaster: false
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: metallb-system-metallb-frr-k8s-statuscleaner
            patch: |
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate

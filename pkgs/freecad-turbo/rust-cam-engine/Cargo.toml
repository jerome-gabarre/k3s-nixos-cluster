[package]
name = "freecad-rs-universal"
version = "1.0.0"
edition = "2021"

[lib]
name = "freecad_rs_universal"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "freecad-turbo-worker"
path = "src/bin/worker.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py311"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
